<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ultimate iPad Monitor</title>

<style>
body{
    font-family:sans-serif;
    padding:20px;
}

#log{
    border:1px solid #ccc;
    padding:10px;
    height:80vh;
    overflow-y:auto;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>Ultimate iPad Monitor</h2>

<div id="log"></div>

<script>

const logDiv = document.getElementById("log");

function log(msg){

    const now = new Date();

    const ts =
        now.toLocaleTimeString() +
        "." +
        String(now.getMilliseconds()).padStart(3,"0");

    logDiv.textContent += `[${ts}] ${msg}\n`;

    logDiv.scrollTop = logDiv.scrollHeight;

    console.log(msg);
}

/* =========================
   EVENT LOGGER
========================= */

function watch(target,event){

    target.addEventListener(
        event,
        () => log(event),
        true
    );
}

/* =========================
   WINDOW EVENTS
========================= */

[
"focus",
"blur",
"pageshow",
"pagehide",
"resize",
"orientationchange",
"online",
"offline",
"beforeunload",
"unload"
].forEach(e => watch(window,e));

/* =========================
   DOCUMENT EVENTS
========================= */

[
"visibilitychange",
"focusin",
"focusout",
"selectionchange",
"fullscreenchange",
"pointerlockchange"
].forEach(e => watch(document,e));

/* =========================
   TOUCH EVENTS
========================= */

[
"touchstart",
"touchend",
"pointerdown",
"pointerup"
].forEach(e => watch(document,e));

/* =========================
   PAGE LIFECYCLE
========================= */

[
"freeze",
"resume"
].forEach(e => {

    document.addEventListener(
        e,
        () => log(e)
    );

});

/* =========================
   VISIBILITY DETAILS
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        log(
            "visibilityState=" +
            document.visibilityState
        );

    }
);

/* =========================
   STATE CHANGE DETECTOR
========================= */

let previous = {};

function snapshot(){

    return {

        focus:
            document.hasFocus(),

        hidden:
            document.hidden,

        visibility:
            document.visibilityState,

        width:
            window.innerWidth,

        height:
            window.innerHeight,

        vvWidth:
            visualViewport
                ? visualViewport.width
                : null,

        vvHeight:
            visualViewport
                ? visualViewport.height
                : null,

        scale:
            visualViewport
                ? visualViewport.scale
                : null,

        activeElement:
            document.activeElement
                ? document.activeElement.tagName
                : "null"
    };
}

function compare(){

    const current = snapshot();

    if(
        JSON.stringify(current)
        !==
        JSON.stringify(previous)
    ){

        log(
            "STATE -> " +
            JSON.stringify(current)
        );

        previous = current;
    }
}

previous = snapshot();

setInterval(compare,250);

/* =========================
   TIMER THROTTLING TEST
========================= */

let last = performance.now();

setInterval(() => {

    const now = performance.now();

    const drift = now - last;

    if(drift > 500){

        log(
            "TIMER_DRIFT=" +
            Math.round(drift) +
            "ms"
        );
    }

    last = now;

},100);

/* =========================
   VISUAL VIEWPORT EVENTS
========================= */

if(visualViewport){

    visualViewport.addEventListener(
        "resize",
        () => log("visualViewport.resize")
    );

    visualViewport.addEventListener(
        "scroll",
        () => log("visualViewport.scroll")
    );
}

/* =========================
   START
========================= */

log("MONITOR STARTED");

log(
    "INITIAL STATE -> " +
    JSON.stringify(snapshot())
);

</script>

</body>
</html>
