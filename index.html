<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Focus Integrity Monitor</title>

<style>

body{
    font-family:system-ui,sans-serif;
    padding:20px;
    margin:0;
}

#status{
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.good{
    background:#e8f7e8;
    border:2px solid #5ea85e;
}

.bad{
    background:#ffe5e5;
    border:2px solid #d9534f;
}

#headline{
    margin-top:0;
}

#summary{
    line-height:1.6;
}

#log{
    border:1px solid #ccc;
    border-radius:10px;
    padding:10px;
    height:50vh;
    overflow-y:auto;
    white-space:pre-wrap;
    font-family:monospace;
}

</style>

</head>
<body>

<div id="status" class="good">

<h1 id="headline">
🟢 TEST PULITO
</h1>

<div id="summary">
Avvio monitor...
</div>

</div>

<h2>Log eventi</h2>

<div id="log"></div>

<script>

const statusBox =
    document.getElementById("status");

const headline =
    document.getElementById("headline");

const summary =
    document.getElementById("summary");

const logBox =
    document.getElementById("log");

const startTime =
    Date.now();

let criticalEvents = 0;

function timestamp(){

    return new Date()
        .toLocaleTimeString();

}

function log(msg){

    logBox.textContent +=
        "[" +
        timestamp() +
        "] " +
        msg +
        "\n";

    logBox.scrollTop =
        logBox.scrollHeight;

}

function critical(msg){

    criticalEvents++;

    log(
        "🔴 " + msg
    );

    updateStatus();

}

function updateStatus(){

    const elapsed =
        Math.floor(
            (Date.now()-startTime)
            /1000
        );

    const minutes =
        Math.floor(elapsed/60);

    const seconds =
        elapsed%60;

    const timeString =
        `${minutes}m ${seconds}s`;

    if(
        criticalEvents === 0
    ){

        statusBox.className =
            "good";

        headline.textContent =
            "🟢 TEST PULITO";

        summary.innerHTML = `
        <b>Tempo di test:</b>
        ${timeString}

        <br><br>

        Eventi critici: 0

        <br><br>

        <b>VERDETTO</b>

        <br>

        Nessun segnale rilevato di:

        <ul>
            <li>Perdita di focus</li>
            <li>Pagina nascosta</li>
            <li>Sospensione</li>
            <li>Cambio applicazione rilevabile</li>
        </ul>
        `;

        return;
    }

    statusBox.className =
        "bad";

    headline.textContent =
        "🔴 ATTENZIONE";

    summary.innerHTML = `
    <b>Tempo di test:</b>
    ${timeString}

    <br><br>

    Eventi critici:
    ${criticalEvents}

    <br><br>

    <b>VERDETTO</b>

    <br>

    È stato rilevato almeno un evento
    compatibile con:

    <ul>
        <li>Perdita di focus</li>
        <li>Pagina nascosta</li>
        <li>Sospensione</li>
        <li>Cambio applicazione</li>
    </ul>
    `;

}

/* ==========================
   EVENTI CRITICI
========================== */

window.addEventListener(
    "blur",
    () =>
    critical(
        "Focus perso"
    )
);

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.hidden
        ){

            critical(
                "Pagina nascosta"
            );

        }

    }
);

window.addEventListener(
    "pagehide",
    () =>
    critical(
        "Page hide"
    )
);

document.addEventListener(
    "freeze",
    () =>
    critical(
        "Freeze"
    )
);

/* ==========================
   TIMER THROTTLING
========================== */

let last =
    performance.now();

setInterval(() => {

    const now =
        performance.now();

    const drift =
        now - last;

    if(
        drift > 2000
    ){

        critical(
            "JavaScript sospeso o rallentato"
        );

    }

    last = now;

},250);

/* ==========================
   AVVIO
========================== */

log(
    "🟢 Monitor avviato"
);

updateStatus();

</script>

</body>
</html>
