<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>iPad Focus Dashboard</title>

<style>

body{
    font-family: system-ui, sans-serif;
    padding:20px;
}

#status{
    border:2px solid #ccc;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.good{
    background:#e8f7e8;
}

.warn{
    background:#fff4d6;
}

.bad{
    background:#ffe0e0;
}

#log{
    border:1px solid #ccc;
    height:55vh;
    overflow-y:auto;
    padding:10px;
    white-space:pre-wrap;
}

h1{
    margin-top:0;
}

</style>
</head>

<body>

<h1>Focus Monitor</h1>

<div id="status" class="good">

<h2 id="headline">🟢 TEST PULITO</h2>

<div id="summary">
Nessuna anomalia rilevata.
</div>

</div>

<div id="log"></div>

<script>

const logBox = document.getElementById("log");
const headline = document.getElementById("headline");
const summary = document.getElementById("summary");
const statusBox = document.getElementById("status");

let anomalies = [];

const startTime = Date.now();

function timestamp(){
    return new Date().toLocaleTimeString();
}

function log(msg){

    logBox.textContent +=
        "[" + timestamp() + "] " +
        msg + "\n";

    logBox.scrollTop =
        logBox.scrollHeight;
}

function addAnomaly(type,msg){

    anomalies.push(msg);

    if(type === "warning"){
        statusBox.className = "warn";
        headline.textContent =
            "🟡 EVENTO RILEVATO";
    }

    if(type === "critical"){
        statusBox.className = "bad";
        headline.textContent =
            "🔴 ATTENZIONE";
    }

    updateSummary();
}

function updateSummary(){

    const seconds =
        Math.floor(
            (Date.now()-startTime)/1000
        );

    if(anomalies.length === 0){

        summary.innerHTML =
        `
        Tempo trascorso: ${seconds}s<br>
        ✅ Focus mantenuto<br>
        ✅ Pagina visibile<br>
        ✅ Nessuna sospensione rilevata<br>
        ✅ Nessun rallentamento anomalo
        `;

        return;
    }

    summary.innerHTML =
        `
        Tempo trascorso: ${seconds}s<br><br>
        Eventi rilevati:<br>
        ${anomalies.join("<br>")}
        `;
}

setInterval(updateSummary,1000);

/* ======================
   EVENTI CRITICI
====================== */

window.addEventListener("blur",()=>{

    log("🔴 Focus perso");

    addAnomaly(
        "critical",
        "🔴 Focus perso"
    );

});

document.addEventListener(
    "visibilitychange",
    ()=>{

        log(
          "🔴 Visibility -> " +
          document.visibilityState
        );

        addAnomaly(
          "critical",
          "🔴 Pagina nascosta"
        );

    }
);

window.addEventListener(
    "pagehide",
    ()=>{

        log(
          "🔴 Page hidden"
        );

        addAnomaly(
          "critical",
          "🔴 Page hide"
        );

    }
);

/* ======================
   RESIZE
====================== */

window.addEventListener(
    "resize",
    ()=>{

        log(
          "🟡 Resize rilevato"
        );

        addAnomaly(
          "warning",
          "🟡 Viewport modificata"
        );

    }
);

/* ======================
   VISUAL VIEWPORT
====================== */

if(window.visualViewport){

    visualViewport.addEventListener(
        "resize",
        ()=>{

            log(
              "🟡 Visual viewport modificata"
            );

            addAnomaly(
              "warning",
              "🟡 Visual viewport modificata"
            );

        }
    );
}

/* ======================
   TIMER DRIFT
====================== */

let last = performance.now();

setInterval(()=>{

    const now =
        performance.now();

    const drift =
        now - last;

    if(drift > 1000){

        log(
          "🟠 Timer rallentato (" +
          Math.round(drift) +
          " ms)"
        );

        addAnomaly(
          "warning",
          "🟠 Timer rallentato"
        );
    }

    last = now;

},250);

/* ======================
   FREEZE / RESUME
====================== */

["freeze","resume"].forEach(event=>{

    document.addEventListener(
        event,
        ()=>{

            log(
              "🔴 " + event
            );

            addAnomaly(
              "critical",
              "🔴 " + event
            );

        }
    );

});

/* ======================
   AVVIO
====================== */

log("🟢 Monitor avviato");

</script>

</body>
</html>
