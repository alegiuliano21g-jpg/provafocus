<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Focus Test</title>
<style>
body { font-family: sans-serif; padding: 20px; }
#log {
    border: 1px solid #ccc;
    height: 70vh;
    overflow-y: auto;
    white-space: pre-wrap;
    padding: 10px;
}
</style>
</head>
<body>

<h2>Advanced Focus / Visibility Monitor</h2>
<div id="log"></div>

<script>

const logDiv = document.getElementById("log");

function log(msg) {
    const ts = new Date().toLocaleTimeString();
    logDiv.textContent += `[${ts}] ${msg}\n`;
    logDiv.scrollTop = logDiv.scrollHeight;
    console.log(msg);
}

function register(target, event) {
    target.addEventListener(event, e => {
        log(`${event}`);
    }, true);
}

const windowEvents = [
    "focus",
    "blur",
    "pageshow",
    "pagehide",
    "resize",
    "orientationchange",
    "online",
    "offline",
    "beforeunload",
    "unload"
];

const documentEvents = [
    "visibilitychange",
    "fullscreenchange",
    "focusin",
    "focusout",
    "selectionchange"
];

const pointerEvents = [
    "pointerdown",
    "pointerup",
    "touchstart",
    "touchend"
];

windowEvents.forEach(e => register(window, e));
documentEvents.forEach(e => register(document, e));
pointerEvents.forEach(e => register(document, e));

document.addEventListener("visibilitychange", () => {
    log(`visibilityState=${document.visibilityState}`);
});

setInterval(() => {

    log(
      `heartbeat | hidden=${document.hidden}` +
      ` | focus=${document.hasFocus()}` +
      ` | width=${window.innerWidth}` +
      ` | height=${window.innerHeight}`
    );

}, 2000);

log("Advanced monitor started");

</script>

</body>
</html>
